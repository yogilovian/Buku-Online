<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Book - Aplikasi Buku Online KAI</title>
    <style>
       :root {
            --primary: #2563eb;
            --primary-hover: #F26924;
            --dark: #1e293b;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER & NAVIGASI --- */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 900;
            color: var(--primary);
        }

        .logo-img {
            height: 40px;
            width: auto;
            display: block;
        }

        /* --- FORM PENCARIAN API --- */
        .search-form {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 500px;
        }

        .search-input {
            flex-grow: 1;
            padding: 0.75rem 1.25rem;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
        }

        .search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        /* --- MAIN KONTEN --- */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            flex-grow: 1;
            width: 100%;
        }

        .status-message {
            text-align: center;
            font-size: 1.2rem;
            color: #64748b;
            margin-top: 4rem;
        }

        /* --- GRID BUKU HASIL API --- */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2.5rem;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow);
        }

        .cover-wrapper {
            background-color: #f1f5f9;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .book-cover {
            height: 85%;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 4px;
            transition: transform 0.3s;
        }

        .book-card:hover .book-cover {
            transform: scale(1.05);
        }

        .book-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 3.1rem;
        }

        .book-author {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-view {
            margin-top: auto;
            background-color: #f1f5f9;
            color: var(--dark);
            text-align: center;
            padding: 0.75rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background-color: var(--primary);
            color: white;
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--dark);
            color: #94a3b8;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            border-top: 1px solid #334155;
        }

        /* --- RESPONSIVITAS --- */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1.25rem;
            }
            .search-form {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Navigasi Utama -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                <img src="gambar/logo kai.png" alt="Logo KAI" class="logo-img">
                <span>BOOK</span>
            </a>
            <form class="search-form" id="searchForm">
                <input type="text" class="search-input" id="queryInput" placeholder="Ketik judul buku" required>
                <button type="submit" class="search-btn">Cari</button>
            </form>
        </nav>
    </header>

    <main class="container">
        <div id="statusMessage" class="status-message">Silakan ketik judul buku di atas untuk mencari...</div>
        <div class="book-grid" id="bookGrid"></div>
    </main>

    <footer>
        <p>&copy; 2026 KAIBook By Yogi Lovian.</p>
    </footer>

    <script>
                // Tentukan batas maksimal buku yang muncul di halaman utama (misal: 4 buku)
        const BATAS_HALAMAN_UTAMA = 4;

        async function muatBuku(kataKunci = '') {
            const bookGrid = document.getElementById('bookGrid');
            const statusMessage = document.getElementById('statusMessage');

            bookGrid.innerHTML = '';
            statusMessage.style.display = 'block';
            statusMessage.innerText = 'Sedang memuat data buku...';

            try {
                const response = await fetch('buku.json');
                if (!response.ok) throw new Error('Gagal memuat data buku.');
                
                const dataBuku = await response.json();
                let hasilFilter = [];

                if (kataKunci === '') {
                    // Tampilkan koleksi terbatas di halaman utama (misal: 4 data pertama)
                    hasilFilter = dataBuku.slice(0, BATAS_HALAMAN_UTAMA);
                } else {
                    // Jika user mencari sesuatu, cari di SELURUH data tanpa batasan slice
                    hasilFilter = dataBuku.filter(buku => 
                        buku.title.toLowerCase().includes(kataKunci) || 
                        buku.author.toLowerCase().includes(kataKunci)
                      );
                }

                if (hasilFilter.length === 0) {
                    statusMessage.innerText = 'Buku tidak ditemukan. Coba kata kunci lain.';
                    return;
                }

                statusMessage.style.display = 'none';

                hasilFilter.forEach(buku => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    const coverSrc = buku.cover || 'gambar/default-cover.png';

                    card.innerHTML = `
                        <div class="cover-wrapper">
                            <img src="${coverSrc}" alt="Cover ${buku.title}" class="book-cover">
                        </div>
                        <div class="book-info">
                            <h3 class="book-title" title="${buku.title}">${buku.title}</h3>
                            <p class="book-author">Oleh: ${buku.author}</p>
                            <a href="${buku.link || '#'}" class="btn-view" target="_blank">Baca Buku</a>
                        </div>
                    `;
                    bookGrid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                statusMessage.innerText = 'Terjadi kesalahan saat mengambil data buku.';
            }
        }

        // Jalankan otomatis saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            muatBuku(); 
        });

        // Fitur pencarian
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('queryInput').value.trim().toLowerCase();
            muatBuku(query);
        });

        // Hapus fungsi openBook yang lama, ganti dengan ini:
        function openBook(pdfUrl) {
            var modal = document.getElementById('bookModal');
            var iframe = document.getElementById('modalFrame');
    
            if (modal && iframe) {
                iframe.src = pdfUrl;
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeBook() {
            var modal = document.getElementById('bookModal');
            var iframe = document.getElementById('modalFrame');
    
            if (modal && iframe) {
                modal.style.display = 'none';
                iframe.src = '';
                document.body.style.overflow = 'auto';
            }
        }
         // 1. JALANKAN OTOMATIS: Tampilkan semua buku saat halaman pertama kali dibuka
        document.addEventListener('DOMContentLoaded', () => {
            muatBuku(); 
        });
    </script>
<div id="bookModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:white; width:95%; max-width:1100px; height:90%; margin:2% auto; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; position:relative;">
        <div style="padding:15px 20px; background:#f8fafc; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0;">
            <span style="font-weight:bold; color:#1e293b;">KAIBook Digital Reader</span>
            <button onclick="closeBook()" style="background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold;">Tutup</button>
        </div>
        <iframe id="modalFrame" style="width:100%; flex-grow:1; border:none;" src=""></iframe>
    </div>
</div>
</body>
</html>
