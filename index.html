<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Book - Aplikasi Buku Online KAI</title>
    <style>
        
        /* --- VARIABEL WARNA & RESET --- */
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --dark: #0f172a;
    --light: #f8fafc;
    --border: #e2e8f0;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
    background-color: var(--light);
    color: var(--dark);
}

/* --- NAVIGASI & HEADER (SESUAI HTML ANDA) --- */
header {
    background-color: #ffffff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
}

.navbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2rem;
}

.logo {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--primary);
    text-decoration: none;
    white-space: nowrap;
    letter-spacing: -0.5px;
}

.search-form {
    display: flex;
    gap: 0.5rem;
    width: 100%;
    max-width: 550px;
}

.search-input {
    flex-grow: 1;
    padding: 0.75rem 1.25rem;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s ease;
}

/* Efek interaktif saat kolom pencarian diklik */
.search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

.search-btn {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 0 1.75rem;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease;
}

.search-btn:hover {
    background-color: var(--primary-hover);
}

/* --- RESPONSIVITAS MOBILE --- */
@media (max-width: 640px) {
    .navbar {
        flex-direction: column;
        padding: 1.25rem 1.5rem;
        gap: 1rem;
    }
    
    .search-form {
        max-width: 100%;
    }
    
    .search-input {
        padding: 0.65rem 1rem;
    }
}
    </style>
</head>
<body>

    <!-- Navigasi Utama -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">📖 KAIBook</a>
            <form class="search-form" id="searchForm">
                <input type="text" class="search-input" id="queryInput" placeholder="Ketik judul buku, contoh: 'Bumi Manusia'..." required>
                <button type="submit" class="search-btn">Cari</button>
            </form>
        </nav>
    </header>

    <!-- Tempat Menampilkan Hasil Pencarian -->
    <main class="container">
        <div id="statusMessage" class="status-message">Silakan ketik judul buku di atas untuk mencari koleksi digital...</div>
        <div class="book-grid" id="bookGrid"></div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Yogi Lovian Copyright.</p>
    </footer>

    <!-- Logika JavaScript untuk Integrasi API dan Untuk ke Buku.json-->
    <script>
    document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const query = document.getElementById('queryInput').value.toLowerCase();
        const bookGrid = document.getElementById('bookGrid');
        const statusMessage = document.getElementById('statusMessage');

        bookGrid.innerHTML = '';
        statusMessage.style.display = 'block';
        statusMessage.innerText = 'Sedang mencari buku...';

        // 1. Ambil data dari buku PDF lokal Anda (buku.json)
        fetch('Buku.json')
            .then(res => res.json())
            .then(lokalBuku => {
                // Filter buku lokal yang cocok dengan judul atau penulis
                const hasilLokal = lokalBuku.filter(buku => 
                    buku.judul.toLowerCase().includes(query) || 
                    buku.penulis.toLowerCase().includes(query)
                );

                // Tampilkan buku lokal terlebih dahulu (jika ada)
                hasilLokal.forEach(buku => {
                    const cardHTML = `
                        <div class="book-card" style="border: 2px solid var(--primary);">
                            <div class="cover-wrapper">
                                <img src="${buku.cover}" alt="${buku.judul}" class="book-cover">
                            </div>
                            <div class="book-info">
                                <span style="color: var(--primary); font-size: 0.75rem; font-weight: bold; margin-bottom: 5px;">📄 KOLEKSI PDF</span>
                                <h3 class="book-title" title="${buku.judul}">${buku.judul}</h3>
                                <p class="book-author">${buku.penulis}</p>
                                <a href="${buku.file_pdf}" target="_blank" class="btn-view" style="background-color: var(--primary); color: white;">Buka / Baca PDF</a>
                            </div>
                        </div>
                    `;
                    bookGrid.innerHTML += cardHTML;
                });

                // 2. Lanjutkan mencari ke Google Books API untuk melengkapi hasil
                return fetch(`https://googleapis.com{encodeURIComponent(query)}&maxResults=8`);
            })
            .then(response => response.json())
            .then(data => {
                statusMessage.style.display = 'none';

                // Jika di lokal tidak ada dan di google api juga kosong
                if (bookGrid.children.length === 0 && (!data.items || data.items.length === 0)) {
                    statusMessage.style.display = 'block';
                    statusMessage.innerText = 'Buku tidak ditemukan di koleksi PDF maupun internet.';
                    return;
                }

                // Tampilkan hasil dari Google Books jika ada
                if (data.items) {
                    data.items.forEach(item => {
                        const volumeInfo = item.volumeInfo;
                        const coverImg = volumeInfo.imageLinks ? volumeInfo.imageLinks.thumbnail : 'https://unsplash.com';
                        const title = volumeInfo.title || 'Judul Tidak Tersedia';
                        const authors = volumeInfo.authors ? volumeInfo.authors.join(', ') : 'Penulis Anonim';
                        const previewLink = volumeInfo.previewLink || '#';

                        const cardHTML = `
                            <div class="book-card">
                                <div class="cover-wrapper">
                                    <img src="${coverImg}" alt="${title}" class="book-cover">
                                </div>
                                <div class="book-info">
                                    <h3 class="book-title" title="${title}">${title}</h3>
                                    <p class="book-author">${authors}</p>
                                    <a href="${previewLink}" target="_blank" class="btn-view">Baca Detail / Preview</a>
                                </div>
                            </div>
                        `;
                        bookGrid.innerHTML += cardHTML;
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                if(bookGrid.children.length === 0) {
                    statusMessage.style.display = 'block';
                    statusMessage.innerText = 'Terjadi kesalahan koneksi.';
                } else {
                    statusMessage.style.display = 'none';
                }
            });
    });
</script>
</body>
